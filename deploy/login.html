<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b120f">
<title>暮林夜话 · 访问验证</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#1c2b24,#070d0a 70%);color:#e9e1cd;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}
  main{width:min(360px,100%);padding:30px 26px;border:1px solid rgba(212,178,122,.28);border-radius:16px;background:rgba(10,17,14,.82);box-shadow:0 24px 70px rgba(0,0,0,.45)}
  h1{margin:0 0 8px;font-size:22px;letter-spacing:.08em}
  p{margin:0 0 22px;color:#9da79f;font-size:13px;line-height:1.7}
  label{display:block;font-size:12px;letter-spacing:.12em;color:#c9b786;margin-bottom:8px}
  input{width:100%;padding:13px 14px;border:1px solid rgba(212,178,122,.35);border-radius:9px;background:#0c1511;color:#f3ecdd;font-size:16px;outline:none}
  input:focus{border-color:#d4b27a}
  button{width:100%;margin-top:16px;padding:13px;border:0;border-radius:9px;background:#d4b27a;color:#151b16;font-size:15px;font-weight:700;letter-spacing:.12em}
</style>
</head>
<body>
<main>
  <h1>暮林夜话</h1>
  <p>此页为私人预览。请输入访问密码后进入山舍。</p>
  <form method="get" action="/mulin/">
    <label for="access">访问密码</label>
    <input id="access" name="access" type="password" autocomplete="current-password" required autofocus>
    <button type="submit">进入暮林</button>
  </form>
</main>
</body>
</html>
