# Add inside the existing HTTPS server block, next to the other locations.
# Replace <ACCESS_TOKEN> with the server-side token. Do not commit the real token.
location = /mulin/login.html {
    auth_basic off;
    root /var/www/mulin-login;
    add_header Cache-Control "no-store" always;
}

location = /mulin {
    return 301 /mulin/$is_args$args;
}

location ^~ /mulin/ {
    auth_basic off;
    if ($arg_access = "<ACCESS_TOKEN>") {
        add_header Set-Cookie "mulin_access=<ACCESS_TOKEN>; Path=/mulin/; Max-Age=2592000; Secure; HttpOnly; SameSite=Lax" always;
        return 302 /mulin/;
    }
    if ($cookie_mulin_access != "<ACCESS_TOKEN>") {
        return 302 /mulin/login.html;
    }
    proxy_pass http://127.0.0.1:8787/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
}
