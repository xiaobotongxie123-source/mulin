<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" role="img">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1230"/><stop offset=".48" stop-color="#14234a"/><stop offset="1" stop-color="#08111e"/>
    </linearGradient>
    <radialGradient id="moon" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#fff7dc"/><stop offset=".7" stop-color="#d9d1b9"/><stop offset="1" stop-color="#8f9bb2"/>
    </radialGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#263b65"/><stop offset=".55" stop-color="#18294c"/><stop offset="1" stop-color="#0b152b"/>
    </linearGradient>
    <linearGradient id="cloak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d3159"/><stop offset=".55" stop-color="#142443"/><stop offset="1" stop-color="#0b1730"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2d6bd"/><stop offset=".7" stop-color="#d9b194"/><stop offset="1" stop-color="#b88770"/>
    </linearGradient>
    <radialGradient id="orb" cx=".36" cy=".32" r=".76">
      <stop offset="0" stop-color="#fdfff5"/><stop offset=".22" stop-color="#d9f8ff"/><stop offset=".55" stop-color="#72cfe5"/><stop offset=".82" stop-color="#3d85bc"/><stop offset="1" stop-color="#1c3e75"/>
    </radialGradient>
    <radialGradient id="orbGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#b9f6ff" stop-opacity=".8"/><stop offset=".45" stop-color="#69c9e7" stop-opacity=".28"/><stop offset="1" stop-color="#5aa7dc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2dc9f"/><stop offset=".5" stop-color="#caa86d"/><stop offset="1" stop-color="#86643c"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".065"/></feComponentTransfer>
    </filter>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b14" stop-opacity="0"/><stop offset="1" stop-color="#070b14" stop-opacity=".78"/>
    </linearGradient>
  </defs>

