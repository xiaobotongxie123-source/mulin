    <path d="M303 104c5-6 11-5 14 1" fill="none" stroke="#8f8b84" stroke-width="2"/>
  </g>
  <path d="M247 250c4 17 10 31 20 44" fill="none" stroke="#3a2b20" stroke-width="7" stroke-linecap="round"/>

