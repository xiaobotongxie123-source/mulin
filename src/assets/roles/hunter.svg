<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" role="img">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#37243a"/><stop offset=".34" stop-color="#7a4240"/><stop offset=".64" stop-color="#cf8150"/><stop offset=".82" stop-color="#e9b56f"/><stop offset="1" stop-color="#5a4938"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff1c0"/><stop offset=".5" stop-color="#ffc879"/><stop offset="1" stop-color="#ffb16c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cape" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6e5a36"/><stop offset=".55" stop-color="#493e2b"/><stop offset="1" stop-color="#2a251d"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b4c35"/><stop offset=".55" stop-color="#493426"/><stop offset="1" stop-color="#2b1f19"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c7a4"/><stop offset=".7" stop-color="#d49f7c"/><stop offset="1" stop-color="#aa7357"/>
    </linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7049"/><stop offset=".55" stop-color="#5f4b35"/><stop offset="1" stop-color="#382d24"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a66f45"/><stop offset=".55" stop-color="#6c452c"/><stop offset="1" stop-color="#38251b"/>
    </linearGradient>
    <radialGradient id="warm" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffca88" stop-opacity=".38"/><stop offset="1" stop-color="#ffca88" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="15"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".86" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".065"/></feComponentTransfer>
    </filter>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#170f0b" stop-opacity="0"/><stop offset="1" stop-color="#170f0b" stop-opacity=".74"/>
    </linearGradient>
  </defs>

  <rect width="360" height="480" fill="url(#sky)"/>
  <ellipse cx="287" cy="224" rx="112" ry="112" fill="url(#sun)" opacity=".8"/>
  <circle cx="287" cy="224" r="42" fill="#ffe3a0" opacity=".8"/>
