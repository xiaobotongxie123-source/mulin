        <path d="M-51-54c15 0 15 22 0 22M-21-62c0 17 15 17 15 0M31-57c0 17 15 17 15 0"/>
        <path d="M-42-27c15 0 15-21 0-21M20-26c16 0 16 21 0 21"/>
