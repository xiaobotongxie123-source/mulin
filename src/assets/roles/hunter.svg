      <path d="M61 7c10 5 14 14 6 21-8 7-18 7-26 3l3-16Z" fill="#4b3c2d"/>
      <path d="M-47-5c-7 2-11 8-9 15 2 8 10 12 19 10l5-18Z" fill="#6c563c"/>
      <path d="M47-5c7 2 11 8 9 15-2 8-10 12-19 10l-5-18Z" fill="#6c563c"/>
