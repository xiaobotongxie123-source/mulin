        <path d="M-55 4c-4-19 15-36 41-41 28-5 56 4 65 21 6 11 0 22-14 27-27 10-69 10-92-7Z" fill="url(#cap)"/>
        <path d="M-56 4c22 16 72 20 104 6-20 13-61 16-88 6Z" fill="#36271d"/>
        <path d="M-45-17c20-13 49-18 78-11M-35-28c18-9 42-11 62-5" fill="none" stroke="#8f704e" stroke-width="2" opacity=".4"/>
      </g>
      <!-- worried eyebrows -->
      <path d="M-43-9c10-7 21-6 29 2-11-2-20-1-29 4ZM43-9c-10-7-21-6-29 2 11-2 20-1 29 4Z" fill="#3c2b22"/>
      <!-- big worried eyes -->
      <ellipse cx="-22" cy="6" rx="12" ry="14" fill="#f8ebd9"/>
      <ellipse cx="22" cy="6" rx="12" ry="14" fill="#f8ebd9"/>
      <circle cx="-19" cy="6" r="6.4" fill="#3b2a21"/><circle cx="25" cy="6" r="6.4" fill="#3b2a21"/>
      <circle cx="-21" cy="4" r="2" fill="#fff" opacity=".85"/><circle cx="23" cy="4" r="2" fill="#fff" opacity=".85"/>
      <path d="M-34-2c7-5 15-5 22 0M12-2c7-5 15-5 22 0" fill="none" stroke="#7b5844" stroke-width="2" opacity=".5"/>
      <!-- nose and worried mouth -->
      <path d="M-4 16c3 2 5 2 8 0" fill="none" stroke="#b17e64" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M-12 31c5-4 10-5 15-2 4-3 9-2 14 2" fill="none" stroke="#8f5548" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M-28 26c5 1 9 4 11 8M28 26c-5 1-9 4-11 8" fill="none" stroke="#c18d7b" stroke-width="2" opacity=".5"/>
      <ellipse cx="-38" cy="22" rx="10" ry="5" fill="#e39c93" opacity=".2"/>
      <ellipse cx="38" cy="22" rx="10" ry="5" fill="#e39c93" opacity=".2"/>
      <!-- sweat drop -->
