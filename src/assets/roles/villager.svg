    <!-- legs -->
    <path d="M146 353c-4 27-8 45-16 61-5 11 1 20 14 20 14 0 19-10 22-24l9-52Z" fill="#4b4034"/>
    <path d="M214 353c4 27 8 45 16 61 5 11-1 20-14 20-14 0-19-10-22-24l-9-52Z" fill="#4b4034"/>
    <path d="M126 423c-10 4-15 11-13 18 2 7 12 9 24 7l30-3-3-19Z" fill="#2b2119"/>
    <path d="M234 423c10 4 15 11 13 18-2 7-12 9-24 7l-30-3 3-19Z" fill="#2b2119"/>
    <path d="M121 437h44M195 437h44" stroke="#9d7d52" stroke-width="2.6"/>

    <!-- tunic/body -->
    <path d="M137 244c-12 20-17 49-16 83l3 41h112l3-41c1-34-4-63-16-83Z" fill="url(#tunic)"/>
    <path d="M137 248c5 16 24 25 43 25s38-9 43-25l-12-16h-62Z" fill="#b6a074"/>
    <path d="M151 261c10 10 49 10 58 0" fill="none" stroke="#d0b98b" stroke-width="2.2" opacity=".6"/>
    <path d="M133 285c-14 21-20 46-20 71 0 15 11 23 23 14 12-9 17-27 25-42Z" fill="url(#tunic)"/>
    <path d="M227 285c14 21 20 46 20 71 0 15-11 23-23 14-12-9-17-27-25-42Z" fill="url(#tunic)"/>
    <path d="M137 327c20 9 46 11 66 7" fill="none" stroke="#3f3427" stroke-width="7"/>
    <rect x="169" y="322" width="22" height="24" rx="3" fill="#c09a61"/>
    <rect x="173" y="327" width="14" height="14" rx="2" fill="#5a4530"/>
