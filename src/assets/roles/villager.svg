    <g fill="#302c26">
      <path d="M5 275 66 229l63 46-6 10-57-38-52 38Z"/>
      <path d="M233 283 292 237l64 46-6 10-58-38-53 38Z"/>
      <path d="M113 294 157 262l46 32v9l-46-31-40 31Z"/>
