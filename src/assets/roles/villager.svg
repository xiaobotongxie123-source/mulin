    <path d="M175 354h10" stroke="#765f3e" stroke-width="2"/>
    <!-- collar / scarf -->
    <path d="M143 241c10 13 24 19 37 19s27-6 37-19l9 15c-13 15-28 22-46 22s-33-7-46-22Z" fill="#6b4736"/>
    <path d="M181 258c-6 19-5 38 2 55" fill="none" stroke="#8d6149" stroke-width="7"/>
    <path d="M181 279c-3 13-2 25 2 36" fill="none" stroke="#ae7c5d" stroke-width="2" opacity=".6"/>

    <!-- left arm holding lantern -->
    <path d="M130 278c-17 13-27 33-29 52-1 13 9 19 20 12 12-8 19-21 29-29Z" fill="url(#tunic)"/>
    <path d="M104 342c-5 5-7 12-3 16 4 5 11 3 16-2" fill="url(#skin)"/>
    <path d="M101 354c2 3 6 4 10 2" fill="none" stroke="#a77a5d" stroke-width="2"/>
    <!-- right arm raised nervously -->
    <path d="M230 279c15 10 24 26 26 43 1 11-8 17-18 10-11-8-15-23-24-32Z" fill="url(#tunic)"/>
    <path d="M239 325c6 3 11 10 11 16 0 8-8 10-14 5-5-4-7-11-8-16Z" fill="url(#skin)"/>

    <!-- lantern -->
