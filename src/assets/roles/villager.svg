<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" role="img">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101a33"/><stop offset=".55" stop-color="#1b2c45"/><stop offset="1" stop-color="#0a1513"/>
    </linearGradient>
    <radialGradient id="moon" cx=".42" cy=".38" r=".65">
      <stop offset="0" stop-color="#fff6d9"/><stop offset=".75" stop-color="#d8cfb3"/><stop offset="1" stop-color="#9b9b8f"/>
    </radialGradient>
    <linearGradient id="tunic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f825d"/><stop offset=".55" stop-color="#675c42"/><stop offset="1" stop-color="#3e382b"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0ceb3"/><stop offset=".7" stop-color="#d5a98b"/><stop offset="1" stop-color="#b27e67"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d513a"/><stop offset=".55" stop-color="#4a3628"/><stop offset="1" stop-color="#2b211b"/>
    </linearGradient>
    <linearGradient id="lantern" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3c5"/><stop offset=".55" stop-color="#ffc76d"/><stop offset="1" stop-color="#d27e3a"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd38e" stop-opacity=".9"/><stop offset=".35" stop-color="#ffb45a" stop-opacity=".36"/><stop offset="1" stop-color="#ffb45a" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="17"/></filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".84" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".065"/></feComponentTransfer>
    </filter>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070d0a" stop-opacity="0"/><stop offset="1" stop-color="#070d0a" stop-opacity=".7"/>
    </linearGradient>
  </defs>

  <rect width="360" height="480" fill="url(#sky)"/>
  <circle cx="289" cy="95" r="45" fill="url(#moon)" opacity=".85"/>
  <circle cx="276" cy="82" r="8" fill="#a59c86" opacity=".18"/><circle cx="300" cy="108" r="11" fill="#a59c86" opacity=".14"/>
  <g fill="#e7edf7" opacity=".7">
    <circle cx="44" cy="55" r="1.6"/><circle cx="89" cy="34" r="1.1"/><circle cx="146" cy="62" r="1.3"/>
    <circle cx="207" cy="28" r="1"/><circle cx="323" cy="43" r="1.4"/><circle cx="333" cy="151" r="1"/>
    <circle cx="35" cy="138" r="1"/><circle cx="109" cy="112" r=".8"/>
  </g>
  <g fill="#e8d7b2" opacity=".2">
