    <g fill="#ffc578" opacity=".9">
      <rect x="36" y="282" width="21" height="23" rx="2"/>
      <rect x="75" y="281" width="18" height="21" rx="2"/>
      <rect x="266" y="290" width="19" height="22" rx="2"/>
      <rect x="306" y="291" width="21" height="23" rx="2"/>
      <rect x="139" y="300" width="16" height="19" rx="2"/>
    </g>
    <g fill="#21201c">
      <path d="M21 288h51v7H21ZM264 296h64v7h-64ZM129 304h42v6h-42Z"/>
      <path d="M66 238v-15h8v19M292 246v-18h9v21M157 265v-13h7v18"/>
    </g>
  </g>
  <path d="M0 389c35-13 67-4 96-13 31-9 51-24 86-23 34 1 54 18 84 25 34 9 66 0 94 9v93H0Z" fill="#101917"/>
  <path d="M0 419c42-10 76-2 107-8 40-8 60-19 88-18 32 1 53 15 80 20 33 7 58-2 85 4v63H0Z" fill="#0b1311"/>
  <g fill="none" stroke="#334039" stroke-width="3" opacity=".75">
    <path d="M20 398c33-13 66-14 100-5M246 392c31-9 61-8 94 3"/>
    <path d="M56 391v44M72 387v48M245 385v47M263 390v42"/>
  </g>
  <ellipse cx="127" cy="385" rx="100" ry="80" fill="url(#glow)" filter="url(#blur)" opacity=".55"/>

