      <path d="M-42-12c10-9 23-8 30 1-8 10-22 10-30-1Z" fill="url(#eye)"/>
      <path d="M12-11c8-9 21-10 29-1-8 11-21 12-29 1Z" fill="url(#eye)"/>
      <circle cx="-28" cy="-10" r="2.2" fill="#2c0807"/><circle cx="27" cy="-9" r="2.2" fill="#2c0807"/>
      <path d="M-41-24c8-5 17-5 24-1M18-25c8-4 17-3 23 2" fill="none" stroke="#3d3542" stroke-width="2.2"/>
      <!-- muzzle -->
      <path d="M-38 2c4-15 20-24 38-24 19 0 35 9 39 24l-13 25c-8 8-17 12-26 12s-18-4-26-12Z" fill="#cfc7d2"/>
      <path d="M-37 1c-9 1-15 7-15 13 0 7 7 10 15 8l13-9Z" fill="#bdb4c1"/>
      <path d="M37 1c9 1 15 7 15 13 0 7-7 10-15 8l-13-9Z" fill="#bdb4c1"/>
      <path d="M-9-10c6-5 12-5 18 0l-9 7Z" fill="#24161b"/>
      <path d="M-25 24c8 11 17 16 25 16s17-5 25-16l-7 21c-6 9-12 13-18 13s-12-4-18-13Z" fill="#2a1016"/>
      <path d="M-18 25 0 34l18-9-4 18-14 12-14-12Z" fill="#f2e2cf"/>
      <path d="M-3 34h6" stroke="#bd9e8e" stroke-width="2"/>
      <path d="M-35 41c8 9 17 13 27 13M35 41c-8 9-17 13-27 13" fill="none" stroke="#5d4651" stroke-width="2.2" opacity=".7"/>
      <!-- cheek fur tufts -->
      <path d="M-62 10l-20 8 13 12-18 4 21 19M60 10l20 8-13 12 18 4-21 19" fill="url(#fur)"/>
      <path d="M-46 7c-8 8-9 19-2 27M46 7c8 8 9 19 2 27" fill="none" stroke="#b9b3be" stroke-width="2" opacity=".55"/>
      <!-- collar -->
      <path d="M-52 48 0 72l52-24 12 20-64 33-64-33Z" fill="#3a241c"/>
      <path d="M-51 48 0 68l51-20" fill="none" stroke="#a47d53" stroke-width="2.4" opacity=".65"/>
    </g>
  </g>

  <g fill="none" stroke="#a48bc8" stroke-opacity=".28" stroke-width="2">
    <path d="M76 151c19-18 39-25 61-21M284 156c-17-19-35-27-55-24"/>
  </g>
  <g fill="#b9a2df" opacity=".2">
    <path d="M0 409c41-17 80-6 118-12 48-8 90-2 122 8 40 13 80 2 120 12v63H0Z"/>
  </g>
  <rect width="360" height="480" fill="url(#fade)" opacity=".45"/>
  <rect width="360" height="480" filter="url(#grain)" opacity=".55"/>
</svg>
