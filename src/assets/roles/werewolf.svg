    <path d="M236 341c39-3 61 15 66 42 4 20-10 34-23 27-10-6-5-22 7-25 13-4 5-23-13-24-13-1-25 7-38 5Z" fill="url(#furDark)"/>

    <!-- legs and boots -->
    <path d="M144 346c-3 30-8 49-18 66-7 12-2 22 12 22 16 0 22-12 25-30l10-55Z" fill="#5e5c6b"/>
    <path d="M216 346c4 31 10 49 20 66 7 12 2 22-12 22-16 0-22-12-25-30l-10-55Z" fill="#5e5c6b"/>
    <path d="M120 413c-11 7-17 15-15 24 2 9 13 11 27 8l32-6-5-22Z" fill="#2a1c1a"/>
    <path d="M240 413c11 7 17 15 15 24-2 9-13 11-27 8l-32-6 5-22Z" fill="#2a1c1a"/>
    <path d="M115 431h47M198 431h47" stroke="#8d6947" stroke-width="3.4"/>

    <!-- body / leather jacket -->
    <path d="M137 246c-17 27-21 59-16 92 3 16 13 24 31 24h47c18 0 28-8 31-24 5-33 1-65-16-92Z" fill="url(#fur)"/>
    <path d="M147 260c-7 31-8 59-4 82l18 9 20-12 20 12 18-9c4-23 3-51-4-82l-27-14Z" fill="url(#leather)"/>
    <path d="M162 245c5 11 12 17 19 17s14-6 19-17l-6-11h-26Z" fill="#d6cdd7"/>
    <path d="M145 268c-10 17-14 39-12 59M229 268c10 17 14 39 12 59" fill="none" stroke="#bd9b72" stroke-width="2.2" opacity=".55"/>
    <path d="M180 262v90M169 300h22M171 313h18" stroke="#a9845a" stroke-width="2.4" opacity=".65"/>
    <path d="M158 280c13-7 31-7 44 0M174 339l-8 10M186 339l8 10" fill="none" stroke="#c0a276" stroke-width="2" opacity=".5"/>
    <path d="M154 324h52l-4 17h-44Z" fill="#2a1a17"/>
    <rect x="173" y="321" width="16" height="23" rx="3" fill="#a98555"/>
    <rect x="177" y="325" width="8" height="14" rx="2" fill="#38241d"/>

    <!-- arms / clawed hands -->
    <path d="M141 262c-21 9-35 27-39 48-3 16 9 24 21 15 13-9 22-24 36-32Z" fill="url(#leather)"/>
    <path d="M227 260c22 9 37 28 41 50 3 16-9 23-21 14-14-10-23-25-37-32Z" fill="url(#leather)"/>
    <path d="M124 303c-8 5-13 12-14 19l13 4c4-7 9-13 15-17ZM236 303c8 5 13 12 14 19l-13 4c-4-7-9-13-15-17Z" fill="#2c1b17" stroke="#8a6748" stroke-width="2.2"/>
    <path d="M133 273c-8 8-14 17-17 27M227 273c8 8 14 17 17 27" fill="none" stroke="#b18b60" stroke-width="2" opacity=".5"/>
    <path d="M119 309c-7 5-10 13-6 18 5 6 14 3 20-3M249 309c7 5 10 13 6 18-5 6-14 3-20-3" fill="#5d5b69"/>
    <path d="m112 323-8 7M124 326l-5 9M256 323l8 7M244 326l5 9" stroke="#e4d9df" stroke-width="2.4"/>

    <!-- furry neck ruff -->
    <path d="M124 237c9-22 25-34 41-36l15 14 15-14c16 2 32 14 41 36l-18 14-16-12-22 9-22-9-16 12Z" fill="url(#furDark)"/>

    <!-- big chibi wolf head -->
    <g transform="translate(180 170) rotate(-5)">
      <path d="M-71 12c-23-13-31-45-17-69 10-17 25-25 46-30l-4-53 42 38c18 2 35 10 47 24 18 21 17 53-3 73-9 9-20 17-36 22l-1 26c-24 13-51 17-74 9Z" fill="url(#fur)"/>
      <!-- ears -->
      <path d="M-48-60c-3-22 4-38 19-50 9 15 11 34 5 50Z" fill="url(#furDark)"/>
      <path d="M20-62c8-21 20-34 37-39 3 17-4 34-18 48Z" fill="url(#furDark)"/>
      <path d="M-40-65c-1-12 3-22 11-29 4 10 4 21 0 31Z" fill="#b58d91" opacity=".72"/>
      <path d="M29-68c5-11 12-18 21-20-1 10-7 18-16 25Z" fill="#b58d91" opacity=".72"/>
      <!-- forehead fur -->
      <path d="M-40-49c13-9 27-10 40-3-8 11-20 15-40 3ZM3-55c12-6 24-3 33 7-11 5-22 4-33-7Z" fill="#8c8a96"/>
