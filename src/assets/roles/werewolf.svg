<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" role="img">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17152c"/><stop offset=".58" stop-color="#241f3a"/><stop offset="1" stop-color="#0a1110"/>
    </linearGradient>
    <radialGradient id="moon" cx=".38" cy=".34" r=".68">
      <stop offset="0" stop-color="#fff0cd"/><stop offset=".72" stop-color="#d3bb91"/><stop offset="1" stop-color="#8b795f"/>
    </radialGradient>
    <radialGradient id="eye" cx=".42" cy=".35" r=".7">
      <stop offset="0" stop-color="#ffd4a4"/><stop offset=".28" stop-color="#ff4d36"/><stop offset="1" stop-color="#74100e"/>
    </radialGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8a7b2"/><stop offset=".52" stop-color="#727180"/><stop offset="1" stop-color="#454452"/>
    </linearGradient>
    <linearGradient id="furDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#676674"/><stop offset="1" stop-color="#353442"/>
    </linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#80583e"/><stop offset=".55" stop-color="#533528"/><stop offset="1" stop-color="#2d1b17"/>
    </linearGradient>
    <radialGradient id="aura" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#b899ff" stop-opacity=".43"/><stop offset="1" stop-color="#b899ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="15"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".88" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".075"/></feComponentTransfer>
    </filter>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080d0c" stop-opacity="0"/><stop offset="1" stop-color="#080d0c" stop-opacity=".86"/>
    </linearGradient>
  </defs>

  <rect width="360" height="480" fill="url(#sky)"/>
  <circle cx="268" cy="116" r="68" fill="url(#moon)" opacity=".94"/>
  <circle cx="248" cy="96" r="12" fill="#a58e70" opacity=".2"/>
  <circle cx="288" cy="139" r="18" fill="#a58e70" opacity=".16"/>
  <circle cx="260" cy="142" r="6" fill="#a58e70" opacity=".19"/>
  <circle cx="268" cy="116" r="92" fill="none" stroke="#b8a2e3" stroke-opacity=".15"/>
  <g fill="#e4d8ff" opacity=".75">
    <circle cx="47" cy="66" r="1.7"/><circle cx="92" cy="39" r="1.2"/><circle cx="151" cy="61" r="1.4"/>
    <circle cx="203" cy="31" r="1"/><circle cx="323" cy="52" r="1.6"/><circle cx="332" cy="184" r="1.2"/>
    <circle cx="36" cy="146" r="1"/><circle cx="122" cy="104" r=".9"/><circle cx="302" cy="230" r="1.2"/>
  </g>
  <ellipse cx="180" cy="195" rx="155" ry="148" fill="url(#aura)" filter="url(#blur)"/>

  <path d="M0 322c35-15 67-9 95-19 30-11 54-27 88-22 33 5 56 24 88 26 29 2 58-14 89-1v174H0Z" fill="#121b18"/>
  <path d="M0 351c40-17 68-4 96-17 29-13 52-24 84-17 30 6 55 22 84 23 34 1 64-13 96 4v136H0Z" fill="#0a1110"/>
  <g fill="#0b1712">
    <path d="M15 319 0 380h34l-8-55 23 31-6-45 25 26-5-36 26 27Z"/>
    <path d="M300 338l-13 46h31l-8-46 20 24-6-36 22 21-4-29 25 21Z"/>
    <path d="M83 350l-9 35h23l-5-35 16 19-4-27 17 16-3-22 20 16Z" opacity=".75"/>
  </g>

