      <path d="M-15 20c9 5 22 5 32 0v12c-9 7-23 7-32 0Z" fill="#45d585"/>
      <path d="M-5-26h26v9H-5Z" fill="#d1a263" stroke="#674829" stroke-width="3"/>
      <path d="M-13 21c7 2 15 2 22 0" fill="none" stroke="#d9ffe4" stroke-opacity=".7" stroke-width="2"/>
      <circle cx="12" cy="6" r="2" fill="#effff4" opacity=".8"/>
    </g>

    <!-- big head -->
    <g transform="translate(180 205)">
      <path d="M-63 5c-4-46 19-79 63-79s67 33 63 79c-3 36-28 58-63 58s-60-22-63-58Z" fill="url(#skin)"/>
      <!-- hair -->
      <path d="M-62 1c-13-48 12-89 62-89 49 0 75 41 62 89-9-14-13-29-14-45-17 5-32 1-47-14-12 15-27 23-47 24-1 13-6 24-16 35Z" fill="#211a2d"/>
      <path d="M-41-40c9-13 21-19 37-19 16 0 29 6 39 19-13-5-25-5-38 0-13-5-25-5-38 0Z" fill="#38284a" opacity=".75"/>
      <path d="M-49-41c-5 21-4 45 5 66M49-41c5 21 4 45-5 66" fill="none" stroke="#1a1422" stroke-width="4"/>
