      <path d="M-15-56c9-13 20-22 34-27" fill="none" stroke="#b184c7" stroke-opacity=".35" stroke-width="2.4"/>
      <path d="M-38 2c27 7 57 8 91 2" fill="none" stroke="url(#gold)" stroke-width="7"/>
      <path d="M30 22c17 2 31-4 41-16 7-9 16-7 14 4-3 15-14 25-29 29-12 3-22-1-26-17Z" fill="#4a315f" stroke="#1b1220" stroke-width="4"/>
      <path d="M-3-12h27v22H-3Z" fill="#d0a05d" stroke="#1b1220" stroke-width="3"/>
      <path d="M8-4h6v7H8Z" fill="#3d2a4a"/>
    </g>
  </g>

  <g fill="#b9a2df" opacity=".2">
    <path d="M0 431c44-18 87-6 128-12 48-8 88-3 118 7 39 13 75 2 114 12v42H0Z"/>
  </g>
  <rect width="360" height="480" fill="url(#fade)" opacity=".35"/>
  <rect width="360" height="480" filter="url(#grain)" opacity=".5"/>
</svg>
