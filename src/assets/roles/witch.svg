    <path d="M91 392h178c-5 53-31 85-89 85s-84-32-89-85Z" fill="url(#cauldron)"/>
    <ellipse cx="180" cy="393" rx="91" ry="23" fill="#323b45"/>
    <ellipse cx="180" cy="392" rx="77" ry="15" fill="url(#brew)"/>
    <path d="M103 392c7 16 131 16 154 0" fill="none" stroke="#8996a1" stroke-opacity=".3" stroke-width="3"/>
    <path d="M111 428c10 25 34 38 69 38s59-13 69-38" fill="none" stroke="#090b0e" stroke-width="4"/>
    <path d="M126 447h108" stroke="#0a0c0f" stroke-opacity=".65" stroke-width="4"/>
    <path d="M112 405c-13 6-19 19-12 29M248 405c13 6 19 19 12 29" fill="none" stroke="#11151a" stroke-width="7"/>
    <path d="M84 391h192" stroke="#1a2027" stroke-width="8"/>
  </g>
  <g transform="translate(54 4)" fill="#d7ffe0">
    <circle cx="153" cy="376" r="7" opacity=".8"/><circle cx="185" cy="362" r="4.5" opacity=".7"/>
    <circle cx="210" cy="383" r="5.5" opacity=".6"/><circle cx="169" cy="346" r="2.6" opacity=".7"/>
    <circle cx="228" cy="365" r="2.2" opacity=".6"/>
  </g>
  <g transform="translate(54 4)" fill="none" stroke="#9dffbb" stroke-opacity=".3" stroke-width="2">
    <circle cx="132" cy="348" r="6"/><circle cx="242" cy="337" r="4"/><circle cx="196" cy="331" r="3"/>
  </g>

  <!-- witch body -->
  <g stroke="#1b1220" stroke-width="4.4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M126 337c-14 22-25 49-28 80h164c-3-31-14-58-28-80Z" fill="url(#dress)"/>
    <path d="M111 409c39 13 99 13 138 0" fill="none" stroke="#a681c2" stroke-opacity=".45" stroke-width="2.5"/>
    <path d="M132 337c15 19 80 19 96 0l-7-17h-82Z" fill="#3b2850"/>
    <path d="M122 349c-11 19-19 45-20 68M238 349c11 19 19 45 20 68" fill="none" stroke="#c4a46e" stroke-width="2.2" opacity=".55"/>
    <path d="M167 381h26M168 394h24M171 407h18" stroke="#c5a3dc" stroke-width="2.2" opacity=".4"/>

