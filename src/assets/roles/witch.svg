  <g fill="none" stroke="#92f3b0" stroke-opacity=".24" stroke-width="7" filter="url(#soft)">
    <path d="M119 372c-22-31-7-59 16-64 22-5 33 17 19 30-10 9-23 1-17-11"/>
    <path d="M242 381c24-35 12-66-11-76-21-9-37 8-27 25 8 13 24 5 20-8"/>
