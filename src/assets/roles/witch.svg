      <path d="M-11 34c7 7 15 10 23 3" fill="none" stroke="#8f4c5d" stroke-width="3" stroke-linecap="round"/>
      <path d="M-22 31c4 2 8 3 12 2M22 31c-4 2-8 3-12 2" fill="none" stroke="#c48d82" stroke-width="2" opacity=".55"/>
      <ellipse cx="-40" cy="26" rx="11" ry="6" fill="#e69e9e" opacity=".24"/>
      <ellipse cx="40" cy="26" rx="11" ry="6" fill="#e69e9e" opacity=".24"/>
    </g>

    <!-- hat brim + bent hat -->
