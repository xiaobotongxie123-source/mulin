      <ellipse cx="26" cy="9" rx="13" ry="15" fill="#2a1722"/>
      <circle cx="-22" cy="5" r="5" fill="#d4ffdc"/><circle cx="30" cy="5" r="5" fill="#d4ffdc"/>
      <circle cx="-30" cy="14" r="2.1" fill="#fff" opacity=".75"/><circle cx="22" cy="14" r="2.1" fill="#fff" opacity=".75"/>
      <path d="M-37-7c8-6 17-6 23 0M14-7c7-6 16-6 23 0" fill="none" stroke="#3b2733" stroke-width="2.4"/>
