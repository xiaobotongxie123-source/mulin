    <path d="M131 330c-15 14-24 29-29 43-4 13 6 22 18 17 14-6 22-18 31-27Z" fill="url(#dress)"/>
    <path d="M229 330c16 14 25 32 28 48 2 13-9 20-19 13-12-8-20-22-28-30Z" fill="url(#dress)"/>
    <path d="M109 383c-5 7-7 15-2 19 6 5 15 0 19-7" fill="url(#skin)"/>
    <path d="M245 383c5 7 7 15 2 19-6 5-15 0-19-7" fill="url(#skin)"/>
    <path d="M106 395c4 3 9 3 13 0M252 395c-4 3-9 3-13 0" fill="none" stroke="#a97661" stroke-width="1.8" opacity=".7"/>

