<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10172b"/><stop offset=".52" stop-color="#162425"/><stop offset="1" stop-color="#07110d"/>
    </linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a5da4"/><stop offset=".55" stop-color="#5d3b77"/><stop offset="1" stop-color="#352247"/>
    </linearGradient>
    <linearGradient id="dress" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f4c87"/><stop offset=".58" stop-color="#4a315f"/><stop offset="1" stop-color="#2b1c3a"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5d6c0"/><stop offset=".7" stop-color="#ddb397"/><stop offset="1" stop-color="#ba886f"/>
    </linearGradient>
    <radialGradient id="magic" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#c6ffd1" stop-opacity=".85"/><stop offset=".32" stop-color="#62e18d" stop-opacity=".42"/><stop offset=".64" stop-color="#7c5cd8" stop-opacity=".24"/><stop offset="1" stop-color="#7c5cd8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brew" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a7ffba"/><stop offset=".4" stop-color="#4bd97d"/><stop offset="1" stop-color="#247f58"/>
    </linearGradient>
    <radialGradient id="cauldron" cx=".38" cy=".28" r=".8">
      <stop offset="0" stop-color="#4c5560"/><stop offset=".55" stop-color="#252c34"/><stop offset="1" stop-color="#0d1116"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe1a0"/><stop offset=".5" stop-color="#c79b5d"/><stop offset="1" stop-color="#7d5b32"/>
    </linearGradient>
    <filter id="blur" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="17"/></filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".06"/></feComponentTransfer>
    </filter>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050b08" stop-opacity="0"/><stop offset="1" stop-color="#050b08" stop-opacity=".8"/>
    </linearGradient>
  </defs>

  <rect width="360" height="480" fill="url(#bg)"/>
  <ellipse cx="180" cy="350" rx="170" ry="150" fill="url(#magic)" filter="url(#blur)"/>
  <g fill="#2b2342" opacity=".55">
    <circle cx="53" cy="103" r="38"/><circle cx="311" cy="173" r="51"/><circle cx="82" cy="245" r="30"/>
  </g>
  <g fill="#7edb9d" opacity=".5">
    <circle cx="46" cy="62" r="1.6"/><circle cx="91" cy="35" r="1.1"/><circle cx="154" cy="57" r="1.3"/>
    <circle cx="240" cy="31" r="1"/><circle cx="314" cy="75" r="1.4"/><circle cx="330" cy="202" r="1"/>
    <circle cx="37" cy="177" r="1"/><circle cx="119" cy="116" r=".8"/>
  </g>
  <g fill="#0a1712" opacity=".8">
