<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" role="img">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1a2a"/><stop offset=".5" stop-color="#172c3d"/><stop offset="1" stop-color="#08120f"/>
    </linearGradient>
    <radialGradient id="moon" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#f8f0d6"/><stop offset=".7" stop-color="#cfc9bb"/><stop offset="1" stop-color="#88959a"/>
    </radialGradient>
    <linearGradient id="cloak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38536b"/><stop offset=".55" stop-color="#24394e"/><stop offset="1" stop-color="#122132"/>
    </linearGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a8f9e"/><stop offset=".55" stop-color="#4e6373"/><stop offset="1" stop-color="#2d3d49"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9cbb3"/><stop offset=".7" stop-color="#c9a083"/><stop offset="1" stop-color="#a1765f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2d99f"/><stop offset=".5" stop-color="#c6a064"/><stop offset="1" stop-color="#80613a"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd18a" stop-opacity=".8"/><stop offset=".4" stop-color="#ffaf54" stop-opacity=".25"/><stop offset="1" stop-color="#ffaf54" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".84" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".065"/></feComponentTransfer>
    </filter>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050c09" stop-opacity="0"/><stop offset="1" stop-color="#050c09" stop-opacity=".74"/>
    </linearGradient>
  </defs>

